<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜歌王 - 歌1</title>
  <style>
    body {
      background-color: #000; /* 黑色背景 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      font-family: sans-serif;
    }
    #player-wrapper {
      position: relative;
      width: 90%;
      max-width: 560px;
    }
    #play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3em;
      background-color: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      color: #fff;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 315px;
      border: none;
      pointer-events: none; /* 防止直接點縮圖跳 YouTube */
    }
  </style>
</head>
<body>
  <h2>猜猜這首歌是什麼？</h2>
  <div id="player-wrapper">
    <iframe id="ytplayer" src="https://www.youtube.com/embed/crIP7PuC8Bc?enablejsapi=1" allow="autoplay"></iframe>
    <button id="play-button">▶</button>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer');
    }

    document.getElementById('play-button').addEventListener('click', function() {
      player.playVideo();
      this.style.display = 'none'; // 播放後隱藏按鈕
      document.getElementById('ytplayer').style.pointerEvents = 'auto';
    });
  </script>
</body>
</html>
